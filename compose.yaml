services:
  mia:
    build: .
    restart: unless-stopped
    ports:
      - "${MIA_BIND:-127.0.0.1}:8123:8123"
    environment:
      MIA_DATA_DIR: /data
      MIA_COOKIE_SECURE: "${MIA_COOKIE_SECURE:-false}"
      MIA_AI_ENABLED: "${MIA_AI_ENABLED:-false}"
      MIA_AI_BASE_URL: "${MIA_AI_BASE_URL:-}"
      MIA_AI_MODEL: "${MIA_AI_MODEL:-}"
      MIA_AI_API_KEY: "${MIA_AI_API_KEY:-}"
      MIA_AI_DAILY_CALL_LIMIT: "${MIA_AI_DAILY_CALL_LIMIT:-20}"
    volumes:
      - mia-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8123/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  mia-data:

