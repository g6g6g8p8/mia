name: Mia native Mac development artifacts

on:
  workflow_dispatch:
  push:
    branches: [feat/invite-only-mac-demo]
    paths:
      - 'macos/**'
      - 'mia/**'
      - 'scripts/**'
      - 'requirements.lock'
      - 'pyproject.toml'
      - 'THIRD_PARTY_LICENSES/**'
      - '.github/workflows/mac-demo.yml'
  pull_request:
    paths:
      - 'macos/**'
      - 'scripts/package_macos.py'
      - 'scripts/prepare_macos_artifacts.py'
      - 'scripts/build_macos_app.sh'
      - '.github/workflows/mac-demo.yml'

permissions:
  contents: read

concurrency:
  group: mac-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-companion:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Prepare pinned Ubuntu amd64 offline companion
        run: |
          python3 scripts/check_distribution.py
          python3 scripts/prepare_macos_artifacts.py --output "$RUNNER_TEMP/mia-linux" --cache "$RUNNER_TEMP/mia-downloads" --platform linux --architecture x86_64
      - name: Test actual companion runtime and dependencies
        run: |
          "$RUNNER_TEMP/mia-linux/runtime/bin/python3" -I -m venv "$RUNNER_TEMP/mia-linux-test"
          "$RUNNER_TEMP/mia-linux-test/bin/python" -m pip install --no-index --find-links "$RUNNER_TEMP/mia-linux/wheelhouse" -r requirements.lock
          "$RUNNER_TEMP/mia-linux-test/bin/python" -c 'import fastapi,httpx,uvicorn,sqlite3; assert sqlite3.connect(":memory:").execute("select sqlite_version()").fetchone()'
      - name: Preserve runtime links and executable permissions
        run: tar -C "$RUNNER_TEMP/mia-linux/remote-runtime" -czf "$RUNNER_TEMP/ubuntu24-amd64-offline-companion.tar.gz" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ubuntu24-amd64-offline-companion
          path: ${{ runner.temp }}/ubuntu24-amd64-offline-companion.tar.gz
          retention-days: 7
          if-no-files-found: error

  mac-app:
    needs: linux-companion
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ubuntu24-amd64-offline-companion
          path: ${{ runner.temp }}/mia-companion-download
      - name: Restore companion links and executable permissions
        run: |
          mkdir "$RUNNER_TEMP/mia-remote-runtime"
          tar -C "$RUNNER_TEMP/mia-remote-runtime" -xzf "$RUNNER_TEMP/mia-companion-download/ubuntu24-amd64-offline-companion.tar.gz"
      - name: Verify runner architecture
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: test "$(uname -m)" = "$EXPECTED_ARCHITECTURE"
      - name: Native compile, Swift tests and offline backend lifecycle
        run: |
          scripts/build_macos_app.sh --preflight
          scripts/build_macos_app.sh --output "$RUNNER_TEMP/mia-mac" --cache "$RUNNER_TEMP/mia-downloads" --remote-artifact "$RUNNER_TEMP/mia-remote-runtime" --unsigned
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Mia-UNSIGNED-INTERNAL-${{ matrix.architecture }}
          path: |
            ${{ runner.temp }}/mia-mac/Mia-Development-*.dmg
            ${{ runner.temp }}/mia-mac/Mia-Development-*.dmg.sha256
            ${{ runner.temp }}/mia-mac/Mia-Development-*.dmg.verification.json
            ${{ runner.temp }}/mia-mac/Mia.app/Contents/Resources/build-report.json
          retention-days: 7
          if-no-files-found: error
