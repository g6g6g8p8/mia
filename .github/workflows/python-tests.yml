name: Mia Python regression tests

on:
  push:
    branches: [feat/invite-only-mac-demo]
    paths: ['mia/**', 'tests/**', 'scripts/**', 'requirements.lock', 'pyproject.toml', '.github/workflows/python-tests.yml']
  pull_request:
    paths: ['mia/**', 'tests/**', 'scripts/**', 'requirements.lock', 'pyproject.toml', '.github/workflows/python-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install locked dependencies and isolated Redis test prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip install pytest==8.3.4
      - name: Run existing Python suite including real Redis integration
        env:
          MIA_TEST_REDIS_SERVER: /usr/bin/redis-server
        run: |
          # Recovery fixtures create private parent directories using the process umask.
          umask 077
          python -m pytest -ra
